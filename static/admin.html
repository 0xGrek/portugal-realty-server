<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portugal Realty — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 24px;
      color: #222;
    }
    .container { max-width: 920px; margin: 0 auto; }
    h1 { color: #1a237e; margin: 0 0 8px 0; }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .bar a {
      color: #1a237e;
      text-decoration: none;
      font-weight: 500;
      margin-left: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }
    h2 { color: #1a237e; margin: 0 0 16px 0; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    th { background: #fafafa; color: #555; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-admin { background: #c62828; color: #fff; }
    .badge-user { background: #e0e0e0; color: #555; }
    button {
      padding: 6px 12px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-right: 6px;
      transition: all 0.15s;
    }
    button:hover { background: #f5f5f5; }
    button.danger { color: #c62828; border-color: #ef9a9a; }
    button.danger:hover { background: #ffebee; }
    button.primary {
      background: #1a237e;
      color: #fff;
      border-color: #1a237e;
      padding: 10px 20px;
      font-weight: 600;
    }
    button.primary:hover { background: #283593; }
    .form-row {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }
    .form-row label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    .form-row input[type="text"], .form-row input[type="password"] {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      min-width: 180px;
    }
    .form-row label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-top: 10px; }
    .msg.ok { background: #e8f5e9; color: #2e7d32; }
    .msg.err { background: #ffebee; color: #c62828; }
    .muted { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="bar">
      <h1>Admin Panel</h1>
      <div>
        <a href="/">Dashboard</a>
        <a href="/logout">Logout</a>
      </div>
    </div>

    <div class="card">
      <h2>Create user</h2>
      <div class="form-row">
        <div>
          <label for="newUsername">Username</label>
          <input type="text" id="newUsername" placeholder="e.g. violeta">
        </div>
        <div>
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" placeholder="min 8 chars">
        </div>
        <label class="check">
          <input type="checkbox" id="newIsAdmin"> Admin
        </label>
        <button class="primary" onclick="createUser()">Create</button>
      </div>
      <div id="createMsg"></div>
    </div>

    <div class="card">
      <h2>Users</h2>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Created</th>
            <th>Last login</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="5" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let CSRF_TOKEN = '';

    function showMsg(el, text, ok) {
      el.innerHTML = '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + text + '</div>';
      setTimeout(function () { el.innerHTML = ''; }, 4000);
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    async function loadMe() {
      const r = await fetch('/api/me', { credentials: 'same-origin' });
      if (!r.ok) { window.location.href = '/login'; return; }
      const data = await r.json();
      CSRF_TOKEN = data.csrf_token || '';
      if (!data.is_admin) { window.location.href = '/'; }
    }

    async function loadUsers() {
      const r = await fetch('/api/admin/users', { credentials: 'same-origin' });
      if (!r.ok) {
        document.getElementById('userTable').innerHTML =
          '<tr><td colspan="5" class="muted">Failed to load users</td></tr>';
        return;
      }
      const data = await r.json();
      const tbody = document.getElementById('userTable');
      tbody.innerHTML = '';
      (data.users || []).forEach(function (u) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td><b>' + escapeHtml(u.username) + '</b></td>' +
          '<td>' + (u.is_admin
            ? '<span class="badge badge-admin">ADMIN</span>'
            : '<span class="badge badge-user">user</span>') + '</td>' +
          '<td>' + fmtDate(u.created_at) + '</td>' +
          '<td>' + fmtDate(u.last_login) + '</td>' +
          '<td>' +
            '<button onclick="resetPassword(' + u.id + ', \'' + escapeAttr(u.username) + '\')">Reset pw</button>' +
            '<button class="danger" onclick="deleteUser(' + u.id + ', \'' + escapeAttr(u.username) + '\')">Delete</button>' +
          '</td>';
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

    async function createUser() {
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value;
      const is_admin = document.getElementById('newIsAdmin').checked;
      const msg = document.getElementById('createMsg');

      if (!username || !password) {
        showMsg(msg, 'Username and password required', false);
        return;
      }

      const r = await fetch('/api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
        credentials: 'same-origin',
        body: JSON.stringify({ username, password, is_admin })
      });
      const data = await r.json().catch(function () { return {}; });

      if (r.ok) {
        showMsg(msg, 'User "' + username + '" created', true);
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newIsAdmin').checked = false;
        loadUsers();
      } else {
        showMsg(msg, data.error || 'Failed', false);
      }
    }

    async function resetPassword(userId, username) {
      const pw = prompt('New password for "' + username + '" (min 8 chars):');
      if (!pw) return;
      const r = await fetch('/api/admin/users/' + userId + '/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
        credentials: 'same-origin',
        body: JSON.stringify({ password: pw })
      });
      const data = await r.json().catch(function () { return {}; });
      if (r.ok) alert('Password reset for ' + username);
      else alert('Error: ' + (data.error || 'failed'));
    }

    async function deleteUser(userId, username) {
      if (!confirm('Delete user "' + username + '" and all their data?')) return;
      const r = await fetch('/api/admin/users/' + userId, {
        method: 'DELETE',
        headers: { 'X-CSRF-Token': CSRF_TOKEN },
        credentials: 'same-origin'
      });
      const data = await r.json().catch(function () { return {}; });
      if (r.ok) loadUsers();
      else alert('Error: ' + (data.error || 'failed'));
    }

    (async function init() {
      await loadMe();
      await loadUsers();
    })();
  </script>
</body>
</html>
