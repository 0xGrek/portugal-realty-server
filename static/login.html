<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portugal Realty — Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 360px;
    }
    h2 {
      color: #1a237e;
      margin: 0 0 8px 0;
      text-align: center;
      font-size: 24px;
    }
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 28px;
      font-size: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #444;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #1a237e;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #1a237e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #283593; }
    button:disabled { background: #9fa8da; cursor: not-allowed; }
    .err {
      color: #c62828;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      min-height: 18px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0 16px;
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }
    .btn-demo {
      background: #fff;
      color: #1a237e;
      border: 2px solid #1a237e;
    }
    .btn-demo:hover { background: #f0f2ff; color: #1a237e; }
    .demo-note {
      color: #888;
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Portugal Realty</h2>
    <div class="subtitle">Sign in to continue</div>

    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" id="submitBtn">Sign In</button>
      <div id="err" class="err"></div>
    </form>

    <div class="divider">or</div>

    <form method="get" action="/demo">
      <button type="submit" class="btn-demo">Try Demo (no signup)</button>
      <div class="demo-note">
        Browse all listings. Favorites and notes save in your browser only.
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin'
        });
        const data = await r.json().catch(function () { return {}; });

        if (r.ok) {
          if (data.csrf_token) {
            try { sessionStorage.setItem('csrf_token', data.csrf_token); } catch (e) {}
          }
          window.location.href = '/';
        } else {
          errEl.textContent = data.error || 'Invalid credentials';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
